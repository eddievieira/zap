<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f7a63">
<title>Zap</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f2;--card:#fff;--fg:#15201e;--muted:#5a6b67;--accent:#0f7a63;--on:#fff;--line:#d3dfdc;--warn:#a14a12}
@media (prefers-color-scheme:dark){:root{--bg:#0f1615;--card:#172120;--fg:#e6efed;--muted:#94a8a3;--accent:#3fc4a1;--on:#08201a;--line:#273533;--warn:#f0a46c;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px system-ui,sans-serif}
main{max-width:30rem;margin:0 auto;padding:24px 16px;display:grid;gap:14px}
h1{font-size:24px;margin:0}
label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;box-sizing:border-box;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font:17px system-ui,sans-serif;min-height:70px}
#n{font:20px monospace;min-height:56px}
#lista{display:grid;gap:10px;margin:0;padding:0;list-style:none}
#lista li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px}
#lista span{flex:1;font:18px monospace;min-width:0;overflow-wrap:anywhere}
#lista a{padding:14px 18px;border-radius:10px;background:var(--accent);color:var(--on);font-weight:800;text-decoration:none}
#lista li.ok{opacity:.45}
#lista li.ok span{text-decoration:line-through}
#lista li.ok a{background:var(--line);color:var(--fg)}
#lista li.ruim span{font:15px system-ui,sans-serif;color:var(--warn)}
#conta{margin:0;color:var(--muted);font-size:15px}
button{justify-self:start;border:0;background:none;color:var(--muted);font:600 15px system-ui,sans-serif;text-decoration:underline;padding:0}
</style>
</head>
<body>
<main>
<h1>Abrir conversa no WhatsApp</h1>
<label for="n">Números (um por linha, sem DDD uso o 46)</label>
<textarea id="n" inputmode="tel" autocomplete="off" placeholder="(46) 99123-4567" autofocus></textarea>
<label for="m">Mensagem (opcional, fica salva)</label>
<textarea id="m"></textarea>
<p id="conta"></p>
<ul id="lista"></ul>
<button id="limpar" type="button">Limpar números</button>
</main>
<script>
function normalizar(t){var d=t.replace(/\D/g,"");if(t.trim().charAt(0)=="+"&&d.indexOf("55")!=0)return d.length>=8?d:null;d=d.replace(/^0+/,"");
if(d.length==13||d.length==12)return d.indexOf("55")==0?d:null;if(d.length==11||d.length==10)return"55"+d;if(d.length==9||d.length==8)return"5546"+d;return null}
function formatar(n){if(n.indexOf("55")!=0)return"+"+n;var r=n.slice(4);return"+55 ("+n.slice(2,4)+") "+r.slice(0,-4)+"-"+r.slice(-4)}
function ler(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function gravar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var N=document.getElementById("n"),M=document.getElementById("m"),L=document.getElementById("lista"),C=document.getElementById("conta");
var feitos=JSON.parse(ler("zap-feitos")||"{}");
function at(){var msg=M.value.trim(),linhas=N.value.split(/[\n,;]+/).filter(function(l){return l.trim()}),vistos={},ok=0,tot=0;L.innerHTML="";
linhas.forEach(function(l){var n=normalizar(l),li=document.createElement("li"),s=document.createElement("span");li.appendChild(s);
if(!n){li.className="ruim";s.textContent=l.trim()+": número incompleto";L.appendChild(li);return}
if(vistos[n])return;vistos[n]=1;tot++;if(feitos[n]){li.className="ok";ok++}
var a=document.createElement("a");a.textContent=feitos[n]?"De novo":"Enviar";a.href="https://wa.me/"+n+(msg?"?text="+encodeURIComponent(msg):"");
a.onclick=function(){feitos[n]=1;gravar("zap-feitos",JSON.stringify(feitos));setTimeout(at,500)};
s.textContent=formatar(n);li.appendChild(a);L.appendChild(li)});
C.textContent=tot>1?ok+" de "+tot+" enviados":""}
N.value=ler("zap-nums");M.value=ler("zap-msg");
N.oninput=function(){gravar("zap-nums",N.value);at()};M.oninput=function(){gravar("zap-msg",M.value);at()};
document.getElementById("limpar").onclick=function(){N.value="";feitos={};gravar("zap-nums","");gravar("zap-feitos","{}");at();N.focus()};at();
</script>
</body>
</html>
